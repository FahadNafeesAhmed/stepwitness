[project]
name = "stepwitness"
version = "0.0.1"
description = "Procedure monitoring from a work instruction and CAD, with no labelled video"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "matplotlib",
    "bounding-box",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stepwitness*"]
